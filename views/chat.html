<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RayGPT v.0</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --panel-bg: #ffffff;
    --header-bg: rgba(255, 255, 255, 0.78);
    --text: #1d1d1f;
    --muted: #6e6e73;
    --border: #d2d2d7;
    --accent: #0071e3;
    --accent-2: #6c5ce7;
    --accent-hover: #0077ed;
    --bubble-user: #0071e3;
    --bubble-user-text: #ffffff;
    --bubble-assistant: #eef0f2;
    --bubble-assistant-text: #1d1d1f;
    --error: #d70015;
    --code-bg: rgba(0, 0, 0, 0.06);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --panel-bg: #1c1c1e;
      --header-bg: rgba(20, 20, 22, 0.7);
      --text: #f5f5f7;
      --muted: #98989d;
      --border: #3a3a3c;
      --accent: #0a84ff;
      --accent-2: #9d8cff;
      --accent-hover: #3699ff;
      --bubble-user: #0a84ff;
      --bubble-user-text: #ffffff;
      --bubble-assistant: #2c2c2e;
      --bubble-assistant-text: #f5f5f7;
      --error: #ff453a;
      --code-bg: rgba(255, 255, 255, 0.1);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 20px 28px;
    background: var(--header-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: var(--shadow-sm);
    z-index: 1;
  }
  @media (max-width: 480px) {
    header { padding: 14px 16px; }
    .brand-name { font-size: 19px; }
    #model-select { max-width: 130px; }
  }
  header::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    opacity: 0.7;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
  }
  .brand-mark {
    flex-shrink: 0;
  }
  .brand-name {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .brand-badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--bubble-assistant);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #model-select {
    font-size: 13px;
    font-weight: 500;
    padding: 8px 12px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--panel-bg);
    color: var(--text);
    cursor: pointer;
    max-width: 200px;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #model-select:hover { border-color: var(--muted); }
  #logout-btn {
    font-size: 13px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  #logout-btn:hover { border-color: var(--muted); background: var(--bubble-assistant); }
  #model-select:focus-visible,
  #logout-btn:focus-visible,
  #send-btn:focus-visible,
  #sidebar-toggle:focus-visible,
  #new-chat-btn:focus-visible,
  .thread-item:focus-visible,
  .thread-item-rename:focus-visible,
  .thread-item-delete:focus-visible,
  .sidebar-setting select:focus-visible,
  #input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #sidebar-toggle {
    display: none;
    font-size: 18px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }

  .app-body {
    position: relative;
    flex: 1;
    display: flex;
    min-height: 0;
    overflow: hidden;
  }
  #sidebar {
    width: 240px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 16px 12px;
    border-right: 1px solid var(--border);
    background: var(--panel-bg);
    overflow: hidden;
  }
  #sidebar-resizer {
    position: relative;
    width: 2px;
    flex-shrink: 0;
    cursor: col-resize;
    background: transparent;
    transition: background 0.1s ease;
  }
  #sidebar-resizer::before {
    /* Invisible wider hit area so a thin, unobtrusive line stays easy to grab */
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: -4px;
    right: -4px;
  }
  #sidebar-resizer:hover,
  #sidebar-resizer.dragging {
    background: var(--accent);
  }
  #new-chat-btn {
    font-size: 14px;
    font-weight: 600;
    padding: 10px 12px;
    border-radius: 9px;
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  #new-chat-btn:hover { border-color: var(--accent); background: var(--bubble-assistant); }
  #thread-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .sidebar-footer {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-top: 4px;
  }
  .sidebar-divider {
    height: 1px;
    background: var(--border);
    margin: 0 -12px;
  }
  .sidebar-setting {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .sidebar-setting label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .sidebar-setting select {
    font-size: 13px;
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-bg);
    color: var(--text);
    cursor: pointer;
  }
  .sidebar-setting select:hover { border-color: var(--muted); }
  .thread-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
  }
  .thread-item:hover { background: var(--bubble-assistant); }
  .thread-item.active { background: var(--bubble-assistant); border-color: var(--accent); font-weight: 600; }
  .thread-item-title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .thread-item-rename,
  .thread-item-delete {
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    padding: 2px 4px;
    border-radius: 4px;
    opacity: 0;
    transition: opacity 0.1s ease;
  }
  .thread-item:hover .thread-item-rename,
  .thread-item:hover .thread-item-delete { opacity: 1; }
  .thread-item-rename:hover { color: var(--text); }
  .thread-item-delete:hover { color: var(--error); }
  .thread-item-title-input {
    flex: 1;
    min-width: 0;
    font: inherit;
    color: inherit;
    background: var(--panel-bg);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 1px 5px;
    outline: none;
  }
  #sidebar-backdrop { display: none; }

  @media (max-width: 768px) {
    #sidebar-toggle { display: inline-block; }
    #sidebar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 20;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
      box-shadow: var(--shadow-md);
    }
    #sidebar.open { transform: translateX(0); }
    #sidebar { max-width: 85vw; }
    #sidebar-resizer { display: none; }
    #sidebar-backdrop {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 15;
    }
    #sidebar-backdrop.open { display: block; }
  }

  main {
    flex: 1;
    overflow: hidden;
    display: flex;
    justify-content: center;
  }
  #chat-container {
    width: 100%;
    max-width: 1400px;
    display: flex;
    flex-direction: column;
    padding: 0 16px;
  }
  @media (min-width: 640px) {
    #chat-container {
      width: 66.67vw;
    }
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-gutter: stable;
    padding: 28px 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #messages:empty::before {
    content: 'Ask anything to get started.';
    margin: auto;
    color: var(--muted);
    font-size: 15px;
  }
  .msg {
    max-width: 75%;
    padding: 11px 16px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.5;
    word-wrap: break-word;
    box-shadow: var(--shadow-sm);
    animation: msg-in 0.18s ease-out;
  }
  .msg.user,
  .msg.pending,
  .msg.error {
    white-space: pre-wrap;
  }
  .msg.assistant > *:first-child { margin-top: 0; }
  .msg.assistant > *:last-child { margin-bottom: 0; }
  .msg.assistant p { margin: 0 0 10px; }
  .msg.assistant ul,
  .msg.assistant ol {
    margin: 0 0 10px;
    padding-left: 22px;
  }
  .msg.assistant li { margin: 2px 0; }
  .msg.assistant pre {
    background: var(--code-bg);
    padding: 10px 12px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 0 0 10px;
  }
  .msg.assistant code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.88em;
  }
  .msg.assistant :not(pre) > code {
    background: var(--code-bg);
    padding: 2px 5px;
    border-radius: 4px;
  }
  .msg.assistant pre code {
    background: none;
    padding: 0;
  }
  .msg.assistant a {
    color: var(--accent);
    text-decoration: underline;
  }
  .msg.assistant blockquote {
    margin: 0 0 10px;
    padding-left: 12px;
    border-left: 3px solid var(--border);
    opacity: 0.85;
  }
  .msg.assistant h1,
  .msg.assistant h2,
  .msg.assistant h3 {
    margin: 14px 0 8px;
    font-size: 1.1em;
    font-weight: 700;
  }
  .msg.assistant hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 10px 0;
  }
  .msg.assistant .thinking {
    margin-bottom: 10px;
    font-size: 0.85em;
    color: var(--muted);
  }
  .msg.assistant .thinking summary {
    cursor: pointer;
    font-weight: 600;
    list-style: none;
  }
  .msg.assistant .thinking summary::-webkit-details-marker { display: none; }
  .msg.assistant .thinking summary::before {
    content: '▸';
    display: inline-block;
    margin-right: 4px;
    transition: transform 0.15s ease;
  }
  .msg.assistant .thinking[open] summary::before {
    transform: rotate(90deg);
  }
  .msg.assistant .thinking-body {
    margin-top: 6px;
    padding-left: 14px;
    border-left: 2px solid var(--border);
    font-style: italic;
  }
  .msg.assistant .thinking-body > *:last-child { margin-bottom: 0; }
  .msg.assistant .truncated-note {
    margin-top: 8px;
    font-size: 0.8em;
    font-style: italic;
    color: var(--muted);
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--bubble-assistant);
    color: var(--bubble-assistant-text);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: center;
    background: transparent;
    color: var(--error);
    font-size: 13px;
    box-shadow: none;
  }
  .msg.pending {
    align-self: flex-start;
    background: var(--bubble-assistant);
    color: var(--muted);
    font-style: italic;
  }

  form#composer {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 16px 0 24px;
    border-top: 1px solid var(--border);
  }
  .composer-row {
    display: flex;
    gap: 10px;
  }
  #attachment-previews {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .attachment-chip {
    position: relative;
    box-shadow: var(--shadow-sm);
  }
  .attachment-chip.image-attachment {
    width: 56px;
    height: 56px;
    border-radius: 8px;
    overflow: hidden;
  }
  .attachment-chip.image-attachment img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .attachment-chip.file-attachment {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 56px;
    max-width: 160px;
    padding: 0 22px 0 10px;
    border-radius: 8px;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    font-size: 12px;
  }
  .attachment-chip.file-attachment .file-icon { font-size: 18px; flex: 0 0 auto; }
  .attachment-chip.file-attachment .file-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .attachment-chip-remove {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 18px;
    height: 18px;
    line-height: 16px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
  }
  #image-btn,
  #file-btn {
    flex: 0 0 auto;
    width: 44px;
    font-size: 17px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel-bg);
    color: var(--text);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: background 0.15s ease, transform 0.1s ease;
  }
  #image-btn:hover:not(:disabled),
  #file-btn:hover:not(:disabled) { background: var(--bubble-assistant); }
  #image-btn:active:not(:disabled),
  #file-btn:active:not(:disabled) { transform: scale(0.97); }
  #image-btn:disabled,
  #file-btn:disabled { opacity: 0.5; cursor: default; }
  .msg .msg-text { white-space: pre-wrap; }
  .msg .msg-image {
    display: block;
    max-width: 220px;
    max-height: 220px;
    border-radius: 10px;
    margin-bottom: 6px;
  }
  .msg .msg-file {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(127, 127, 127, 0.12);
    margin-bottom: 6px;
    font-size: 0.92em;
  }
  .msg .msg-file .file-icon { font-size: 16px; }
  #input {
    flex: 1;
    resize: none;
    font-size: 15px;
    font-family: inherit;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel-bg);
    color: var(--text);
    outline: none;
    max-height: 140px;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  #send-btn {
    font-size: 15px;
    font-weight: 600;
    padding: 0 22px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: background 0.15s ease, transform 0.1s ease;
  }
  #send-btn:hover:not(:disabled) { background: var(--accent-hover); }
  #send-btn:active:not(:disabled) { transform: scale(0.97); }
  #send-btn:disabled { opacity: 0.5; cursor: default; }
  #send-btn.stop { background: var(--error); }
  #send-btn.stop:hover { filter: brightness(1.1); }
</style>
</head>
<body>
  <header>
    <button id="sidebar-toggle" aria-label="Toggle chat history">☰</button>
    <h1 class="brand">
      <svg class="brand-mark" width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="brandGradient" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
            <stop offset="0" style="stop-color:var(--accent)" />
            <stop offset="1" style="stop-color:var(--accent-2)" />
          </linearGradient>
        </defs>
        <path d="M12 0C12 6.6 6.6 12 0 12C6.6 12 12 17.4 12 24C12 17.4 17.4 12 24 12C17.4 12 12 6.6 12 0Z" fill="url(#brandGradient)" />
      </svg>
      <span class="brand-name">RayGPT</span>
      <span class="brand-badge">v.0</span>
    </h1>
    <div class="header-actions">
      <select id="model-select" aria-label="Model"></select>
      <button id="logout-btn">Log Out</button>
    </div>
  </header>

  <div class="app-body">
    <aside id="sidebar">
      <button id="new-chat-btn">+ New Chat</button>
      <div id="thread-list"></div>
      <div class="sidebar-footer">
        <div class="sidebar-divider"></div>
        <div class="sidebar-setting">
          <label for="response-length-select">Response length</label>
          <select id="response-length-select">
            <option value="short">Short</option>
            <option value="medium">Medium</option>
            <option value="long">Long</option>
          </select>
        </div>
        <div class="sidebar-setting">
          <label for="agent-select">Agent</label>
          <select id="agent-select"></select>
        </div>
      </div>
    </aside>
    <div id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize chat history"></div>
    <div id="sidebar-backdrop"></div>

    <main>
      <div id="chat-container">
        <div id="messages"></div>
        <form id="composer">
          <div id="attachment-previews" hidden></div>
          <div class="composer-row">
            <input type="file" id="file-input" accept=".pdf,.docx,.xlsx,.xls" multiple hidden />
            <button type="button" id="file-btn" aria-label="Attach file">📎</button>
            <input type="file" id="image-input" accept="image/*" multiple hidden />
            <button type="button" id="image-btn" aria-label="Attach image" hidden>🖼️</button>
            <textarea id="input" rows="1" placeholder="Type a message..."></textarea>
            <button type="submit" id="send-btn">Send</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="/vendor/marked.js"></script>
  <script src="/vendor/dompurify.js"></script>
  <script src="/vendor/mammoth.js"></script>
  <script src="/vendor/exceljs.js"></script>
  <script>
    const messagesEl = document.getElementById('messages');
    const composer = document.getElementById('composer');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const modelSelect = document.getElementById('model-select');
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const sidebarResizer = document.getElementById('sidebar-resizer');
    const sidebarBackdrop = document.getElementById('sidebar-backdrop');
    const newChatBtn = document.getElementById('new-chat-btn');
    const threadListEl = document.getElementById('thread-list');
    const responseLengthSelect = document.getElementById('response-length-select');
    const agentSelect = document.getElementById('agent-select');
    const imageBtn = document.getElementById('image-btn');
    const imageInput = document.getElementById('image-input');
    const fileBtn = document.getElementById('file-btn');
    const fileInput = document.getElementById('file-input');
    const attachmentPreviewsEl = document.getElementById('attachment-previews');

    let history = [];
    let activeController = null;

    // Which models can accept images, keyed by model id — filled in from
    // /api/models (which derives it from OpenRouter's live catalog). The
    // image button is shown/hidden based on this rather than a hardcoded list.
    //
    // The file (📎) button isn't gated the same way: PDFs go through
    // OpenRouter's own universal PDF parser (works with any model), and
    // Word/Excel files are converted to plain text in the browser before
    // sending — so neither depends on the selected model's declared modalities.
    let modelCapabilities = new Map();

    // Staged attachments not yet sent, in the order they'll appear in the
    // outgoing message. Each entry is one of:
    //   { id, kind: 'image', name, dataUrl }
    //   { id, kind: 'pdf',   name, dataUrl }
    //   { id, kind: 'doc',   name, text }        (extracted from .docx/.xlsx/.xls)
    let stagedAttachments = [];

    function updateImageButtonVisibility() {
      const supportsImages = modelCapabilities.get(modelSelect.value) === true;
      imageBtn.hidden = !supportsImages;
      if (!supportsImages && stagedAttachments.some((a) => a.kind === 'image')) {
        stagedAttachments = stagedAttachments.filter((a) => a.kind !== 'image');
        renderAttachmentPreviews();
      }
    }

    // Conversation threads persist in this browser via localStorage (no
    // server-side storage). Each thread keeps its own messages and the model
    // last used with it; `history` always points at the active thread's
    // messages array, so pushing to it updates the thread in place.
    const STORAGE_KEY = 'raygpt.threads.v1';

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { threads: [], activeId: null };
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed.threads) ? parsed : { threads: [], activeId: null };
      } catch {
        return { threads: [], activeId: null };
      }
    }

    let state = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch {
        // localStorage unavailable (private browsing, quota, etc.) — chat
        // still works this session, it just won't persist across reloads.
      }
    }

    function getActiveThread() {
      return state.threads.find((t) => t.id === state.activeId) || null;
    }

    function makeThreadTitle(text) {
      const trimmed = text.trim().replace(/\s+/g, ' ');
      // Cap well past anything the sidebar could ever visually fit (even at
      // its max drag width), so the CSS ellipsis on .thread-item-title does
      // the real, width-aware truncation — this cap only exists to avoid
      // storing an entire pasted essay as a "title".
      return trimmed.length > 200 ? trimmed.slice(0, 200) + '…' : trimmed;
    }

    function touchActiveThread() {
      const thread = getActiveThread();
      if (!thread) return;
      thread.updatedAt = Date.now();
      saveState();
      renderThreadList();
    }

    function closeSidebarOnMobile() {
      sidebar.classList.remove('open');
      sidebarBackdrop.classList.remove('open');
    }

    function renderThreadList() {
      threadListEl.innerHTML = '';
      const sorted = [...state.threads].sort((a, b) => b.updatedAt - a.updatedAt);
      for (const t of sorted) {
        const item = document.createElement('div');
        item.className = 'thread-item' + (t.id === state.activeId ? ' active' : '');
        item.tabIndex = 0;
        item.setAttribute('role', 'button');

        const title = document.createElement('span');
        title.className = 'thread-item-title';
        title.textContent = t.title || 'New chat';
        title.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          startRenaming(item, title, t);
        });
        item.appendChild(title);

        const rename = document.createElement('button');
        rename.className = 'thread-item-rename';
        rename.textContent = '✎';
        rename.setAttribute('aria-label', 'Rename chat');
        rename.addEventListener('click', (e) => {
          e.stopPropagation();
          startRenaming(item, title, t);
        });
        item.appendChild(rename);

        const del = document.createElement('button');
        del.className = 'thread-item-delete';
        del.textContent = '✕';
        del.setAttribute('aria-label', 'Delete chat');
        del.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteThread(t.id);
        });
        item.appendChild(del);

        item.addEventListener('click', () => switchToThread(t.id));
        item.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            switchToThread(t.id);
          }
        });

        threadListEl.appendChild(item);
      }
    }

    function startRenaming(item, titleEl, thread) {
      let cancelled = false;
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'thread-item-title-input';
      input.value = thread.title || '';
      input.maxLength = 100;

      input.addEventListener('click', (e) => e.stopPropagation());
      input.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Enter') {
          e.preventDefault();
          input.blur();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          cancelled = true;
          renderThreadList();
        }
      });
      input.addEventListener('blur', () => {
        if (cancelled) return;
        const value = input.value.trim();
        thread.title = value || 'New chat';
        saveState();
        renderThreadList();
      });

      item.replaceChild(input, titleEl);
      input.focus();
      input.select();
    }

    function renderHistory() {
      messagesEl.innerHTML = '';
      for (const m of history) {
        const bubble = addBubble(m.role === 'user' ? 'user' : 'assistant', '');
        if (m.role === 'assistant') {
          renderAssistantText(bubble, m.content);
        } else {
          renderUserContent(bubble, m.content);
        }
      }
    }

    function applyThreadModel(thread) {
      if (thread.model && [...modelSelect.options].some((o) => o.value === thread.model)) {
        modelSelect.value = thread.model;
      }
      updateImageButtonVisibility();
    }

    function switchToThread(id) {
      if (id === state.activeId) return closeSidebarOnMobile();
      if (activeController) activeController.abort();
      const thread = state.threads.find((t) => t.id === id);
      if (!thread) return;
      state.activeId = id;
      history = thread.messages;
      renderHistory();
      applyThreadModel(thread);
      renderThreadList();
      saveState();
      closeSidebarOnMobile();
    }

    function createThread() {
      if (activeController) activeController.abort();
      const thread = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        title: '',
        model: modelSelect.value || '',
        messages: [],
        updatedAt: Date.now(),
      };
      state.threads.push(thread);
      state.activeId = thread.id;
      history = thread.messages;
      messagesEl.innerHTML = '';
      renderThreadList();
      saveState();
      closeSidebarOnMobile();
      input.focus();
    }

    function deleteThread(id) {
      state.threads = state.threads.filter((t) => t.id !== id);
      if (state.activeId !== id) {
        renderThreadList();
        saveState();
        return;
      }
      state.activeId = null;
      const next = [...state.threads].sort((a, b) => b.updatedAt - a.updatedAt)[0];
      if (next) {
        switchToThread(next.id);
      } else {
        createThread();
      }
    }

    newChatBtn.addEventListener('click', createThread);
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarBackdrop.classList.toggle('open');
    });
    sidebarBackdrop.addEventListener('click', closeSidebarOnMobile);

    // Drag-to-resize the sidebar. Width is remembered in localStorage so it
    // stays put across reloads, same as the thread state.
    const SIDEBAR_WIDTH_KEY = 'raygpt.sidebarWidth';
    const MIN_SIDEBAR_WIDTH = 160;
    const MAX_SIDEBAR_WIDTH = 480;

    function applySidebarWidth(px) {
      const clamped = Math.max(MIN_SIDEBAR_WIDTH, Math.min(MAX_SIDEBAR_WIDTH, px));
      sidebar.style.width = clamped + 'px';
    }

    try {
      const savedWidth = localStorage.getItem(SIDEBAR_WIDTH_KEY);
      if (savedWidth) applySidebarWidth(parseInt(savedWidth, 10));
    } catch {
      // localStorage unavailable — sidebar just uses the default width
    }

    let resizing = false;

    function startResize() {
      resizing = true;
      sidebarResizer.classList.add('dragging');
      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'col-resize';
    }

    function doResize(clientX) {
      if (!resizing) return;
      const rect = sidebar.getBoundingClientRect();
      applySidebarWidth(clientX - rect.left);
    }

    function endResize() {
      if (!resizing) return;
      resizing = false;
      sidebarResizer.classList.remove('dragging');
      document.body.style.userSelect = '';
      document.body.style.cursor = '';
      try {
        localStorage.setItem(SIDEBAR_WIDTH_KEY, String(Math.round(sidebar.getBoundingClientRect().width)));
      } catch {
        // localStorage unavailable — width just won't persist across reloads
      }
    }

    sidebarResizer.addEventListener('mousedown', (e) => {
      e.preventDefault();
      startResize();
    });
    window.addEventListener('mousemove', (e) => doResize(e.clientX));
    window.addEventListener('mouseup', endResize);

    sidebarResizer.addEventListener('touchstart', startResize, { passive: true });
    window.addEventListener('touchmove', (e) => {
      if (!resizing) return;
      doResize(e.touches[0].clientX);
    });
    window.addEventListener('touchend', endResize);

    modelSelect.addEventListener('change', () => {
      const thread = getActiveThread();
      if (thread) {
        thread.model = modelSelect.value;
        saveState();
      }
      updateImageButtonVisibility();
    });

    async function loadModels() {
      try {
        const res = await fetch('/api/models');
        if (res.status === 401) {
          window.location.href = '/';
          return;
        }
        const data = await res.json();
        if (!data.ok) return;
        modelSelect.innerHTML = '';
        modelCapabilities = new Map();
        for (const m of data.models) {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.label;
          modelSelect.appendChild(opt);
          modelCapabilities.set(m.id, m.supportsImages === true);
        }
        modelSelect.value = data.default;
        updateImageButtonVisibility();
      } catch (err) {
        // dropdown just stays empty; chat still works with the server's default model
      }
    }

    async function loadAgents() {
      try {
        const res = await fetch('/api/agents');
        if (res.status === 401) {
          window.location.href = '/';
          return;
        }
        const data = await res.json();
        if (!data.ok) return;
        agentSelect.innerHTML = '';
        for (const a of data.agents) {
          const opt = document.createElement('option');
          opt.value = a.id;
          opt.textContent = a.label;
          agentSelect.appendChild(opt);
        }
        const saved = localStorage.getItem('raygpt.agent');
        agentSelect.value = saved && [...agentSelect.options].some((o) => o.value === saved) ? saved : data.default;
      } catch (err) {
        // dropdown just stays empty; chat still works without an agent selected
      }
    }

    // Response length and agent are global settings (not tied to any one
    // chat), unlike the model picker which is remembered per-thread.
    const savedResponseLength = localStorage.getItem('raygpt.responseLength');
    responseLengthSelect.value = ['short', 'medium', 'long'].includes(savedResponseLength)
      ? savedResponseLength
      : 'medium';
    responseLengthSelect.addEventListener('change', () => {
      try {
        localStorage.setItem('raygpt.responseLength', responseLengthSelect.value);
      } catch {
        // localStorage unavailable — setting just won't persist across reloads
      }
    });
    agentSelect.addEventListener('change', () => {
      try {
        localStorage.setItem('raygpt.agent', agentSelect.value);
      } catch {
        // localStorage unavailable — setting just won't persist across reloads
      }
    });

    (async () => {
      await Promise.all([loadModels(), loadAgents()]);
      if (state.threads.length === 0) {
        createThread();
        return;
      }
      if (!getActiveThread()) {
        state.activeId = [...state.threads].sort((a, b) => b.updatedAt - a.updatedAt)[0].id;
      }
      const thread = getActiveThread();
      history = thread.messages;
      renderHistory();
      applyThreadModel(thread);
      renderThreadList();
    })();

    function addBubble(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    // A user message's `content` is a plain string for text-only messages, or an
    // OpenAI/OpenRouter-style array of parts once something is attached:
    //   { type: 'text', text }
    //   { type: 'image_url', image_url: { url } }
    //   { type: 'file', file: { filename, file_data } }               (PDF)
    // Word/Excel attachments have no API content type of their own — their
    // extracted text is sent as an extra `text` part, tagged with a
    // recognizable "[Attached document: name]" header so it round-trips back
    // into a labeled chip here instead of reading as part of the user's own
    // message.
    const DOC_ATTACHMENT_PREFIX = /^\[Attached document: (.+?)\]\n\n/;

    function renderUserContent(bubble, content) {
      bubble.textContent = '';
      if (typeof content === 'string') {
        bubble.textContent = content;
        return;
      }
      if (!Array.isArray(content)) return;
      for (const part of content) {
        if (part.type === 'image_url' && part.image_url?.url) {
          const img = document.createElement('img');
          img.className = 'msg-image';
          img.src = part.image_url.url;
          bubble.appendChild(img);
        } else if (part.type === 'file' && part.file?.filename) {
          bubble.appendChild(makeFileChipEl(part.file.filename, '📄'));
        } else if (part.type === 'text' && part.text) {
          const docMatch = part.text.match(DOC_ATTACHMENT_PREFIX);
          if (docMatch) {
            bubble.appendChild(makeFileChipEl(docMatch[1], '📝'));
            continue;
          }
          const textDiv = document.createElement('div');
          textDiv.className = 'msg-text';
          textDiv.textContent = part.text;
          bubble.appendChild(textDiv);
        }
      }
    }

    function makeFileChipEl(name, icon) {
      const chip = document.createElement('div');
      chip.className = 'msg-file';
      chip.innerHTML = `<span class="file-icon">${icon}</span><span>${name}</span>`;
      return chip;
    }

    // Images are downscaled and re-encoded client-side before being sent, so a
    // photo straight off a phone camera doesn't balloon the request (and the
    // stored thread history, which resends every past attachment on every turn).
    const MAX_IMAGE_DIMENSION = 1280;
    const IMAGE_JPEG_QUALITY = 0.82;

    function downscaleImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const objectUrl = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(objectUrl);
          let { width, height } = img;
          if (width > MAX_IMAGE_DIMENSION || height > MAX_IMAGE_DIMENSION) {
            const scale = MAX_IMAGE_DIMENSION / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', IMAGE_JPEG_QUALITY));
        };
        img.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error('Could not load image'));
        };
        img.src = objectUrl;
      });
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    function fileToArrayBuffer(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsArrayBuffer(file);
      });
    }

    // .docx -> plain text via mammoth (self-hosted browser bundle, no server round-trip).
    async function extractDocxText(file) {
      const arrayBuffer = await fileToArrayBuffer(file);
      const result = await window.mammoth.extractRawText({ arrayBuffer });
      return result.value.trim();
    }

    // .xlsx/.xls -> plain text via exceljs: each sheet rendered as a simple
    // comma-separated grid under a heading with its sheet name.
    async function extractSpreadsheetText(file) {
      const arrayBuffer = await fileToArrayBuffer(file);
      const workbook = new window.ExcelJS.Workbook();
      await workbook.xlsx.load(arrayBuffer);
      const sheets = [];
      workbook.eachSheet((worksheet) => {
        const rows = [];
        worksheet.eachRow((row) => {
          const cells = row.values.slice(1).map((v) => (v == null ? '' : String(v)));
          rows.push(cells.join(','));
        });
        sheets.push(`--- ${worksheet.name} ---\n${rows.join('\n')}`);
      });
      return sheets.join('\n\n').trim();
    }

    function renderAttachmentPreviews() {
      attachmentPreviewsEl.innerHTML = '';
      attachmentPreviewsEl.hidden = stagedAttachments.length === 0;
      for (const staged of stagedAttachments) {
        const chip = document.createElement('div');
        chip.className =
          'attachment-chip ' + (staged.kind === 'image' ? 'image-attachment' : 'file-attachment');

        if (staged.kind === 'image') {
          const thumb = document.createElement('img');
          thumb.src = staged.dataUrl;
          chip.appendChild(thumb);
        } else {
          const icon = document.createElement('span');
          icon.className = 'file-icon';
          icon.textContent = staged.kind === 'pdf' ? '📄' : '📝';
          chip.appendChild(icon);
          const name = document.createElement('span');
          name.className = 'file-name';
          name.textContent = staged.name;
          chip.appendChild(name);
        }

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'attachment-chip-remove';
        remove.textContent = '×';
        remove.setAttribute('aria-label', 'Remove attachment');
        remove.addEventListener('click', () => {
          stagedAttachments = stagedAttachments.filter((a) => a.id !== staged.id);
          renderAttachmentPreviews();
        });
        chip.appendChild(remove);

        attachmentPreviewsEl.appendChild(chip);
      }
    }

    function newAttachmentId() {
      return crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());
    }

    imageBtn.addEventListener('click', () => imageInput.click());

    imageInput.addEventListener('change', async () => {
      const files = [...imageInput.files];
      imageInput.value = ''; // allow re-selecting the same file later
      for (const file of files) {
        if (!file.type.startsWith('image/')) continue;
        try {
          const dataUrl = await downscaleImage(file);
          stagedAttachments.push({ id: newAttachmentId(), kind: 'image', name: file.name, dataUrl });
        } catch {
          // skip files that fail to decode rather than blocking the rest
        }
      }
      renderAttachmentPreviews();
    });

    fileBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async () => {
      const files = [...fileInput.files];
      fileInput.value = ''; // allow re-selecting the same file later
      for (const file of files) {
        const ext = file.name.toLowerCase().split('.').pop();
        try {
          if (ext === 'pdf') {
            const dataUrl = await fileToDataUrl(file);
            stagedAttachments.push({ id: newAttachmentId(), kind: 'pdf', name: file.name, dataUrl });
          } else if (ext === 'docx') {
            const text = await extractDocxText(file);
            stagedAttachments.push({ id: newAttachmentId(), kind: 'doc', name: file.name, text });
          } else if (ext === 'xlsx' || ext === 'xls') {
            const text = await extractSpreadsheetText(file);
            stagedAttachments.push({ id: newAttachmentId(), kind: 'doc', name: file.name, text });
          }
          // Other extensions (e.g. legacy .doc) aren't offered by the file
          // picker's accept filter and are silently skipped here too.
        } catch {
          // skip files that fail to parse rather than blocking the rest
        }
      }
      renderAttachmentPreviews();
    });

    function renderAssistantText(el, text) {
      if (window.marked && window.DOMPurify) {
        el.innerHTML = DOMPurify.sanitize(marked.parse(text));
      } else {
        // Markdown libraries failed to load (CDN blocked, offline, etc.) — fall
        // back to plain text rather than breaking the chat.
        el.textContent = text;
      }
    }

    // Some reasoning models stream a flat `reasoning` string; others send a
    // structured `reasoning_details` array. `reasoning.encrypted` entries are
    // opaque provider-signed blobs, not human-readable text, so they're skipped.
    function extractReasoningChunk(delta) {
      if (typeof delta.reasoning === 'string' && delta.reasoning) {
        return delta.reasoning;
      }
      if (Array.isArray(delta.reasoning_details)) {
        let text = '';
        for (const d of delta.reasoning_details) {
          if (d.type === 'reasoning.text' && typeof d.text === 'string') text += d.text;
          else if (d.type === 'reasoning.summary' && typeof d.summary === 'string') text += d.summary;
        }
        return text;
      }
      return '';
    }

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        composer.requestSubmit();
      }
    });

    sendBtn.addEventListener('click', (e) => {
      if (activeController) {
        e.preventDefault();
        activeController.abort();
      }
    });

    composer.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (activeController) return;

      const text = input.value.trim();
      if (!text && stagedAttachments.length === 0) return;

      const userContent =
        stagedAttachments.length === 0
          ? text
          : [
              { type: 'text', text },
              ...stagedAttachments
                .filter((a) => a.kind === 'image')
                .map((a) => ({ type: 'image_url', image_url: { url: a.dataUrl } })),
              ...stagedAttachments
                .filter((a) => a.kind === 'pdf')
                .map((a) => ({ type: 'file', file: { filename: a.name, file_data: a.dataUrl } })),
              ...stagedAttachments
                .filter((a) => a.kind === 'doc')
                .map((a) => ({ type: 'text', text: `[Attached document: ${a.name}]\n\n${a.text}` })),
            ];

      const userBubble = addBubble('user', '');
      renderUserContent(userBubble, userContent);
      history.push({ role: 'user', content: userContent });
      const activeThread = getActiveThread();
      if (activeThread && !activeThread.title) {
        activeThread.title = makeThreadTitle(text) || 'Attachment';
      }
      touchActiveThread();
      input.value = '';
      input.style.height = 'auto';
      stagedAttachments = [];
      renderAttachmentPreviews();

      const controller = new AbortController();
      activeController = controller;
      sendBtn.textContent = 'Stop';
      sendBtn.classList.add('stop');
      input.disabled = true;
      imageBtn.disabled = true;
      fileBtn.disabled = true;
      const bubble = addBubble('pending', 'Thinking...');
      let assistantText = '';
      let reasoningText = '';
      let structured = false;
      let finishReason = '';

      function ensureAssistantStructure() {
        if (structured) return;
        structured = true;
        bubble.classList.remove('pending');
        bubble.classList.add('assistant');
        bubble.innerHTML =
          '<details class="thinking" hidden><summary>Thinking</summary><div class="thinking-body"></div></details><div class="answer"></div><div class="truncated-note" hidden>Response was cut off at the token limit.</div>';
      }

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: history,
            model: modelSelect.value,
            responseLength: responseLengthSelect.value,
            agent: agentSelect.value,
          }),
          signal: controller.signal,
        });

        if (res.status === 401) {
          window.location.href = '/';
          return;
        }

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          bubble.remove();
          addBubble('error', data.error || 'Something went wrong.');
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let streamError = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith('data:')) continue;
            const payload = trimmed.slice(5).trim();
            if (payload === '[DONE]') continue;

            let json;
            try {
              json = JSON.parse(payload);
            } catch {
              continue;
            }

            if (json.error) {
              streamError = json.error.message || 'OpenRouter request failed';
              continue;
            }

            const delta = json.choices?.[0]?.delta || {};
            if (json.choices?.[0]?.finish_reason) {
              finishReason = json.choices[0].finish_reason;
            }

            const reasoningChunk = extractReasoningChunk(delta);
            if (reasoningChunk) {
              ensureAssistantStructure();
              reasoningText += reasoningChunk;
              const thinkingEl = bubble.querySelector('.thinking');
              thinkingEl.hidden = false;
              thinkingEl.open = true;
              renderAssistantText(bubble.querySelector('.thinking-body'), reasoningText);
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }

            if (delta.content) {
              ensureAssistantStructure();
              if (!assistantText) {
                const thinkingEl = bubble.querySelector('.thinking');
                if (thinkingEl) thinkingEl.open = false; // collapse once the real answer starts
              }
              assistantText += delta.content;
              renderAssistantText(bubble.querySelector('.answer'), assistantText);
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
          }
        }

        if (streamError && !assistantText) {
          bubble.remove();
          addBubble('error', streamError);
        } else {
          if (finishReason === 'length') {
            const note = bubble.querySelector('.truncated-note');
            if (note) note.hidden = false;
          }
          history.push({ role: 'assistant', content: assistantText });
          touchActiveThread();
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          if (assistantText) {
            bubble.classList.remove('pending');
            bubble.classList.add('assistant');
            history.push({ role: 'assistant', content: assistantText });
            touchActiveThread();
          } else {
            bubble.remove();
          }
        } else {
          bubble.remove();
          addBubble('error', 'Could not reach the server.');
        }
      } finally {
        activeController = null;
        sendBtn.textContent = 'Send';
        sendBtn.classList.remove('stop');
        input.disabled = false;
        imageBtn.disabled = false;
        fileBtn.disabled = false;
        input.focus();
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/';
    });
  </script>
</body>
</html>
