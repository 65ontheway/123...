<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RayGPT v.0</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --panel-bg: #ffffff;
    --header-bg: rgba(255, 255, 255, 0.78);
    --text: #1d1d1f;
    --muted: #6e6e73;
    --border: #d2d2d7;
    --accent: #0071e3;
    --accent-2: #6c5ce7;
    --accent-hover: #0077ed;
    --bubble-user: #0071e3;
    --bubble-user-text: #ffffff;
    --bubble-assistant: #eef0f2;
    --bubble-assistant-text: #1d1d1f;
    --error: #d70015;
    --code-bg: rgba(0, 0, 0, 0.06);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --panel-bg: #1c1c1e;
      --header-bg: rgba(20, 20, 22, 0.7);
      --text: #f5f5f7;
      --muted: #98989d;
      --border: #3a3a3c;
      --accent: #0a84ff;
      --accent-2: #9d8cff;
      --accent-hover: #3699ff;
      --bubble-user: #0a84ff;
      --bubble-user-text: #ffffff;
      --bubble-assistant: #2c2c2e;
      --bubble-assistant-text: #f5f5f7;
      --error: #ff453a;
      --code-bg: rgba(255, 255, 255, 0.1);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 20px 28px;
    background: var(--header-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: var(--shadow-sm);
    z-index: 1;
  }
  @media (max-width: 480px) {
    header { padding: 14px 16px; }
    .brand-name { font-size: 19px; }
    #model-select { max-width: 130px; }
  }
  header::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    opacity: 0.7;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
  }
  .brand-mark {
    flex-shrink: 0;
  }
  .brand-name {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .brand-badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--bubble-assistant);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #model-select {
    font-size: 13px;
    font-weight: 500;
    padding: 8px 12px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--panel-bg);
    color: var(--text);
    cursor: pointer;
    max-width: 200px;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #model-select:hover { border-color: var(--muted); }
  #logout-btn {
    font-size: 13px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  #logout-btn:hover { border-color: var(--muted); background: var(--bubble-assistant); }
  #model-select:focus-visible,
  #logout-btn:focus-visible,
  #send-btn:focus-visible,
  #sidebar-toggle:focus-visible,
  #new-chat-btn:focus-visible,
  .thread-item:focus-visible,
  .thread-item-rename:focus-visible,
  .thread-item-delete:focus-visible,
  #input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #sidebar-toggle {
    display: none;
    font-size: 18px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }

  .app-body {
    position: relative;
    flex: 1;
    display: flex;
    min-height: 0;
    overflow: hidden;
  }
  #sidebar {
    width: 240px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 16px 12px;
    border-right: 1px solid var(--border);
    background: var(--panel-bg);
    overflow-y: auto;
  }
  #sidebar-resizer {
    width: 6px;
    flex-shrink: 0;
    cursor: col-resize;
    background: transparent;
    transition: background 0.1s ease;
  }
  #sidebar-resizer:hover,
  #sidebar-resizer.dragging {
    background: var(--accent);
  }
  #new-chat-btn {
    font-size: 14px;
    font-weight: 600;
    padding: 10px 12px;
    border-radius: 9px;
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  #new-chat-btn:hover { border-color: var(--accent); background: var(--bubble-assistant); }
  #thread-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .thread-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
  }
  .thread-item:hover { background: var(--bubble-assistant); }
  .thread-item.active { background: var(--bubble-assistant); font-weight: 600; }
  .thread-item-title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .thread-item-rename,
  .thread-item-delete {
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    padding: 2px 4px;
    border-radius: 4px;
    opacity: 0;
    transition: opacity 0.1s ease;
  }
  .thread-item:hover .thread-item-rename,
  .thread-item:hover .thread-item-delete { opacity: 1; }
  .thread-item-rename:hover { color: var(--text); }
  .thread-item-delete:hover { color: var(--error); }
  .thread-item-title-input {
    flex: 1;
    min-width: 0;
    font: inherit;
    color: inherit;
    background: var(--panel-bg);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 1px 5px;
    outline: none;
  }
  #sidebar-backdrop { display: none; }

  @media (max-width: 768px) {
    #sidebar-toggle { display: inline-block; }
    #sidebar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 20;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
      box-shadow: var(--shadow-md);
    }
    #sidebar.open { transform: translateX(0); }
    #sidebar { max-width: 85vw; }
    #sidebar-resizer { display: none; }
    #sidebar-backdrop {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 15;
    }
    #sidebar-backdrop.open { display: block; }
  }

  main {
    flex: 1;
    overflow: hidden;
    display: flex;
    justify-content: center;
  }
  #chat-container {
    width: 100%;
    max-width: 1400px;
    display: flex;
    flex-direction: column;
    padding: 0 16px;
  }
  @media (min-width: 640px) {
    #chat-container {
      width: 66.67vw;
    }
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 28px 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #messages:empty::before {
    content: 'Ask anything to get started.';
    margin: auto;
    color: var(--muted);
    font-size: 15px;
  }
  .msg {
    max-width: 75%;
    padding: 11px 16px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.5;
    word-wrap: break-word;
    box-shadow: var(--shadow-sm);
    animation: msg-in 0.18s ease-out;
  }
  .msg.user,
  .msg.pending,
  .msg.error {
    white-space: pre-wrap;
  }
  .msg.assistant > *:first-child { margin-top: 0; }
  .msg.assistant > *:last-child { margin-bottom: 0; }
  .msg.assistant p { margin: 0 0 10px; }
  .msg.assistant ul,
  .msg.assistant ol {
    margin: 0 0 10px;
    padding-left: 22px;
  }
  .msg.assistant li { margin: 2px 0; }
  .msg.assistant pre {
    background: var(--code-bg);
    padding: 10px 12px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 0 0 10px;
  }
  .msg.assistant code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.88em;
  }
  .msg.assistant :not(pre) > code {
    background: var(--code-bg);
    padding: 2px 5px;
    border-radius: 4px;
  }
  .msg.assistant pre code {
    background: none;
    padding: 0;
  }
  .msg.assistant a {
    color: var(--accent);
    text-decoration: underline;
  }
  .msg.assistant blockquote {
    margin: 0 0 10px;
    padding-left: 12px;
    border-left: 3px solid var(--border);
    opacity: 0.85;
  }
  .msg.assistant h1,
  .msg.assistant h2,
  .msg.assistant h3 {
    margin: 14px 0 8px;
    font-size: 1.1em;
    font-weight: 700;
  }
  .msg.assistant hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 10px 0;
  }
  .msg.assistant .thinking {
    margin-bottom: 10px;
    font-size: 0.85em;
    color: var(--muted);
  }
  .msg.assistant .thinking summary {
    cursor: pointer;
    font-weight: 600;
    list-style: none;
  }
  .msg.assistant .thinking summary::-webkit-details-marker { display: none; }
  .msg.assistant .thinking summary::before {
    content: '▸';
    display: inline-block;
    margin-right: 4px;
    transition: transform 0.15s ease;
  }
  .msg.assistant .thinking[open] summary::before {
    transform: rotate(90deg);
  }
  .msg.assistant .thinking-body {
    margin-top: 6px;
    padding-left: 14px;
    border-left: 2px solid var(--border);
    font-style: italic;
  }
  .msg.assistant .thinking-body > *:last-child { margin-bottom: 0; }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--bubble-assistant);
    color: var(--bubble-assistant-text);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: center;
    background: transparent;
    color: var(--error);
    font-size: 13px;
    box-shadow: none;
  }
  .msg.pending {
    align-self: flex-start;
    background: var(--bubble-assistant);
    color: var(--muted);
    font-style: italic;
  }

  form#composer {
    display: flex;
    gap: 10px;
    padding: 16px 0 24px;
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1;
    resize: none;
    font-size: 15px;
    font-family: inherit;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel-bg);
    color: var(--text);
    outline: none;
    max-height: 140px;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  #send-btn {
    font-size: 15px;
    font-weight: 600;
    padding: 0 22px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: background 0.15s ease, transform 0.1s ease;
  }
  #send-btn:hover:not(:disabled) { background: var(--accent-hover); }
  #send-btn:active:not(:disabled) { transform: scale(0.97); }
  #send-btn:disabled { opacity: 0.5; cursor: default; }
  #send-btn.stop { background: var(--error); }
  #send-btn.stop:hover { filter: brightness(1.1); }
</style>
</head>
<body>
  <header>
    <button id="sidebar-toggle" aria-label="Toggle chat history">☰</button>
    <h1 class="brand">
      <svg class="brand-mark" width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="brandGradient" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
            <stop offset="0" style="stop-color:var(--accent)" />
            <stop offset="1" style="stop-color:var(--accent-2)" />
          </linearGradient>
        </defs>
        <path d="M12 0C12 6.6 6.6 12 0 12C6.6 12 12 17.4 12 24C12 17.4 17.4 12 24 12C17.4 12 12 6.6 12 0Z" fill="url(#brandGradient)" />
      </svg>
      <span class="brand-name">RayGPT</span>
      <span class="brand-badge">v.0</span>
    </h1>
    <div class="header-actions">
      <select id="model-select" aria-label="Model"></select>
      <button id="logout-btn">Log Out</button>
    </div>
  </header>

  <div class="app-body">
    <aside id="sidebar">
      <button id="new-chat-btn">+ New Chat</button>
      <div id="thread-list"></div>
    </aside>
    <div id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize chat history"></div>
    <div id="sidebar-backdrop"></div>

    <main>
      <div id="chat-container">
        <div id="messages"></div>
        <form id="composer">
          <textarea id="input" rows="1" placeholder="Type a message..." required></textarea>
          <button type="submit" id="send-btn">Send</button>
        </form>
      </div>
    </main>
  </div>

  <script src="/vendor/marked.js"></script>
  <script src="/vendor/dompurify.js"></script>
  <script>
    const messagesEl = document.getElementById('messages');
    const composer = document.getElementById('composer');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const modelSelect = document.getElementById('model-select');
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const sidebarResizer = document.getElementById('sidebar-resizer');
    const sidebarBackdrop = document.getElementById('sidebar-backdrop');
    const newChatBtn = document.getElementById('new-chat-btn');
    const threadListEl = document.getElementById('thread-list');

    let history = [];
    let activeController = null;

    // Conversation threads persist in this browser via localStorage (no
    // server-side storage). Each thread keeps its own messages and the model
    // last used with it; `history` always points at the active thread's
    // messages array, so pushing to it updates the thread in place.
    const STORAGE_KEY = 'raygpt.threads.v1';

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { threads: [], activeId: null };
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed.threads) ? parsed : { threads: [], activeId: null };
      } catch {
        return { threads: [], activeId: null };
      }
    }

    let state = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch {
        // localStorage unavailable (private browsing, quota, etc.) — chat
        // still works this session, it just won't persist across reloads.
      }
    }

    function getActiveThread() {
      return state.threads.find((t) => t.id === state.activeId) || null;
    }

    function makeThreadTitle(text) {
      const trimmed = text.trim().replace(/\s+/g, ' ');
      return trimmed.length > 40 ? trimmed.slice(0, 40) + '…' : trimmed;
    }

    function touchActiveThread() {
      const thread = getActiveThread();
      if (!thread) return;
      thread.updatedAt = Date.now();
      saveState();
      renderThreadList();
    }

    function closeSidebarOnMobile() {
      sidebar.classList.remove('open');
      sidebarBackdrop.classList.remove('open');
    }

    function renderThreadList() {
      threadListEl.innerHTML = '';
      const sorted = [...state.threads].sort((a, b) => b.updatedAt - a.updatedAt);
      for (const t of sorted) {
        const item = document.createElement('div');
        item.className = 'thread-item' + (t.id === state.activeId ? ' active' : '');
        item.tabIndex = 0;
        item.setAttribute('role', 'button');

        const title = document.createElement('span');
        title.className = 'thread-item-title';
        title.textContent = t.title || 'New chat';
        title.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          startRenaming(item, title, t);
        });
        item.appendChild(title);

        const rename = document.createElement('button');
        rename.className = 'thread-item-rename';
        rename.textContent = '✎';
        rename.setAttribute('aria-label', 'Rename chat');
        rename.addEventListener('click', (e) => {
          e.stopPropagation();
          startRenaming(item, title, t);
        });
        item.appendChild(rename);

        const del = document.createElement('button');
        del.className = 'thread-item-delete';
        del.textContent = '✕';
        del.setAttribute('aria-label', 'Delete chat');
        del.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteThread(t.id);
        });
        item.appendChild(del);

        item.addEventListener('click', () => switchToThread(t.id));
        item.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            switchToThread(t.id);
          }
        });

        threadListEl.appendChild(item);
      }
    }

    function startRenaming(item, titleEl, thread) {
      let cancelled = false;
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'thread-item-title-input';
      input.value = thread.title || '';
      input.maxLength = 100;

      input.addEventListener('click', (e) => e.stopPropagation());
      input.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Enter') {
          e.preventDefault();
          input.blur();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          cancelled = true;
          renderThreadList();
        }
      });
      input.addEventListener('blur', () => {
        if (cancelled) return;
        const value = input.value.trim();
        thread.title = value || 'New chat';
        saveState();
        renderThreadList();
      });

      item.replaceChild(input, titleEl);
      input.focus();
      input.select();
    }

    function renderHistory() {
      messagesEl.innerHTML = '';
      for (const m of history) {
        const bubble = addBubble(m.role === 'user' ? 'user' : 'assistant', '');
        if (m.role === 'assistant') {
          renderAssistantText(bubble, m.content);
        } else {
          bubble.textContent = m.content;
        }
      }
    }

    function applyThreadModel(thread) {
      if (thread.model && [...modelSelect.options].some((o) => o.value === thread.model)) {
        modelSelect.value = thread.model;
      }
    }

    function switchToThread(id) {
      if (id === state.activeId) return closeSidebarOnMobile();
      if (activeController) activeController.abort();
      const thread = state.threads.find((t) => t.id === id);
      if (!thread) return;
      state.activeId = id;
      history = thread.messages;
      renderHistory();
      applyThreadModel(thread);
      renderThreadList();
      saveState();
      closeSidebarOnMobile();
    }

    function createThread() {
      if (activeController) activeController.abort();
      const thread = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        title: '',
        model: modelSelect.value || '',
        messages: [],
        updatedAt: Date.now(),
      };
      state.threads.push(thread);
      state.activeId = thread.id;
      history = thread.messages;
      messagesEl.innerHTML = '';
      renderThreadList();
      saveState();
      closeSidebarOnMobile();
      input.focus();
    }

    function deleteThread(id) {
      state.threads = state.threads.filter((t) => t.id !== id);
      if (state.activeId !== id) {
        renderThreadList();
        saveState();
        return;
      }
      state.activeId = null;
      const next = [...state.threads].sort((a, b) => b.updatedAt - a.updatedAt)[0];
      if (next) {
        switchToThread(next.id);
      } else {
        createThread();
      }
    }

    newChatBtn.addEventListener('click', createThread);
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarBackdrop.classList.toggle('open');
    });
    sidebarBackdrop.addEventListener('click', closeSidebarOnMobile);

    // Drag-to-resize the sidebar. Width is remembered in localStorage so it
    // stays put across reloads, same as the thread state.
    const SIDEBAR_WIDTH_KEY = 'raygpt.sidebarWidth';
    const MIN_SIDEBAR_WIDTH = 160;
    const MAX_SIDEBAR_WIDTH = 480;

    function applySidebarWidth(px) {
      const clamped = Math.max(MIN_SIDEBAR_WIDTH, Math.min(MAX_SIDEBAR_WIDTH, px));
      sidebar.style.width = clamped + 'px';
    }

    try {
      const savedWidth = localStorage.getItem(SIDEBAR_WIDTH_KEY);
      if (savedWidth) applySidebarWidth(parseInt(savedWidth, 10));
    } catch {
      // localStorage unavailable — sidebar just uses the default width
    }

    let resizing = false;

    function startResize() {
      resizing = true;
      sidebarResizer.classList.add('dragging');
      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'col-resize';
    }

    function doResize(clientX) {
      if (!resizing) return;
      const rect = sidebar.getBoundingClientRect();
      applySidebarWidth(clientX - rect.left);
    }

    function endResize() {
      if (!resizing) return;
      resizing = false;
      sidebarResizer.classList.remove('dragging');
      document.body.style.userSelect = '';
      document.body.style.cursor = '';
      try {
        localStorage.setItem(SIDEBAR_WIDTH_KEY, String(Math.round(sidebar.getBoundingClientRect().width)));
      } catch {
        // localStorage unavailable — width just won't persist across reloads
      }
    }

    sidebarResizer.addEventListener('mousedown', (e) => {
      e.preventDefault();
      startResize();
    });
    window.addEventListener('mousemove', (e) => doResize(e.clientX));
    window.addEventListener('mouseup', endResize);

    sidebarResizer.addEventListener('touchstart', startResize, { passive: true });
    window.addEventListener('touchmove', (e) => {
      if (!resizing) return;
      doResize(e.touches[0].clientX);
    });
    window.addEventListener('touchend', endResize);

    modelSelect.addEventListener('change', () => {
      const thread = getActiveThread();
      if (thread) {
        thread.model = modelSelect.value;
        saveState();
      }
    });

    async function loadModels() {
      try {
        const res = await fetch('/api/models');
        if (res.status === 401) {
          window.location.href = '/';
          return;
        }
        const data = await res.json();
        if (!data.ok) return;
        modelSelect.innerHTML = '';
        for (const m of data.models) {
          const opt = document.createElement('option');
          opt.value = m.id;
          opt.textContent = m.label;
          modelSelect.appendChild(opt);
        }
        modelSelect.value = data.default;
      } catch (err) {
        // dropdown just stays empty; chat still works with the server's default model
      }
    }
    (async () => {
      await loadModels();
      if (state.threads.length === 0) {
        createThread();
        return;
      }
      if (!getActiveThread()) {
        state.activeId = [...state.threads].sort((a, b) => b.updatedAt - a.updatedAt)[0].id;
      }
      const thread = getActiveThread();
      history = thread.messages;
      renderHistory();
      applyThreadModel(thread);
      renderThreadList();
    })();

    function addBubble(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function renderAssistantText(el, text) {
      if (window.marked && window.DOMPurify) {
        el.innerHTML = DOMPurify.sanitize(marked.parse(text));
      } else {
        // Markdown libraries failed to load (CDN blocked, offline, etc.) — fall
        // back to plain text rather than breaking the chat.
        el.textContent = text;
      }
    }

    // Some reasoning models stream a flat `reasoning` string; others send a
    // structured `reasoning_details` array. `reasoning.encrypted` entries are
    // opaque provider-signed blobs, not human-readable text, so they're skipped.
    function extractReasoningChunk(delta) {
      if (typeof delta.reasoning === 'string' && delta.reasoning) {
        return delta.reasoning;
      }
      if (Array.isArray(delta.reasoning_details)) {
        let text = '';
        for (const d of delta.reasoning_details) {
          if (d.type === 'reasoning.text' && typeof d.text === 'string') text += d.text;
          else if (d.type === 'reasoning.summary' && typeof d.summary === 'string') text += d.summary;
        }
        return text;
      }
      return '';
    }

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        composer.requestSubmit();
      }
    });

    sendBtn.addEventListener('click', (e) => {
      if (activeController) {
        e.preventDefault();
        activeController.abort();
      }
    });

    composer.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (activeController) return;

      const text = input.value.trim();
      if (!text) return;

      addBubble('user', text);
      history.push({ role: 'user', content: text });
      const activeThread = getActiveThread();
      if (activeThread && !activeThread.title) activeThread.title = makeThreadTitle(text);
      touchActiveThread();
      input.value = '';
      input.style.height = 'auto';

      const controller = new AbortController();
      activeController = controller;
      sendBtn.textContent = 'Stop';
      sendBtn.classList.add('stop');
      input.disabled = true;
      const bubble = addBubble('pending', 'Thinking...');
      let assistantText = '';
      let reasoningText = '';
      let structured = false;

      function ensureAssistantStructure() {
        if (structured) return;
        structured = true;
        bubble.classList.remove('pending');
        bubble.classList.add('assistant');
        bubble.innerHTML =
          '<details class="thinking" hidden><summary>Thinking</summary><div class="thinking-body"></div></details><div class="answer"></div>';
      }

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history, model: modelSelect.value }),
          signal: controller.signal,
        });

        if (res.status === 401) {
          window.location.href = '/';
          return;
        }

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          bubble.remove();
          addBubble('error', data.error || 'Something went wrong.');
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let streamError = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith('data:')) continue;
            const payload = trimmed.slice(5).trim();
            if (payload === '[DONE]') continue;

            let json;
            try {
              json = JSON.parse(payload);
            } catch {
              continue;
            }

            if (json.error) {
              streamError = json.error.message || 'OpenRouter request failed';
              continue;
            }

            const delta = json.choices?.[0]?.delta || {};

            const reasoningChunk = extractReasoningChunk(delta);
            if (reasoningChunk) {
              ensureAssistantStructure();
              reasoningText += reasoningChunk;
              const thinkingEl = bubble.querySelector('.thinking');
              thinkingEl.hidden = false;
              thinkingEl.open = true;
              renderAssistantText(bubble.querySelector('.thinking-body'), reasoningText);
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }

            if (delta.content) {
              ensureAssistantStructure();
              if (!assistantText) {
                const thinkingEl = bubble.querySelector('.thinking');
                if (thinkingEl) thinkingEl.open = false; // collapse once the real answer starts
              }
              assistantText += delta.content;
              renderAssistantText(bubble.querySelector('.answer'), assistantText);
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
          }
        }

        if (streamError && !assistantText) {
          bubble.remove();
          addBubble('error', streamError);
        } else {
          history.push({ role: 'assistant', content: assistantText });
          touchActiveThread();
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          if (assistantText) {
            bubble.classList.remove('pending');
            bubble.classList.add('assistant');
            history.push({ role: 'assistant', content: assistantText });
            touchActiveThread();
          } else {
            bubble.remove();
          }
        } else {
          bubble.remove();
          addBubble('error', 'Could not reach the server.');
        }
      } finally {
        activeController = null;
        sendBtn.textContent = 'Send';
        sendBtn.classList.remove('stop');
        input.disabled = false;
        input.focus();
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/';
    });
  </script>
</body>
</html>
