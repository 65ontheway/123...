<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --panel-bg: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --border: #d2d2d7;
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --bubble-user: #0071e3;
    --bubble-user-text: #ffffff;
    --bubble-assistant: #eef0f2;
    --bubble-assistant-text: #1d1d1f;
    --error: #d70015;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --panel-bg: #1c1c1e;
      --text: #f5f5f7;
      --muted: #98989d;
      --border: #3a3a3c;
      --accent: #0a84ff;
      --accent-hover: #3699ff;
      --bubble-user: #0a84ff;
      --bubble-user-text: #ffffff;
      --bubble-assistant: #2c2c2e;
      --bubble-assistant-text: #f5f5f7;
      --error: #ff453a;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-bg);
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
  }
  #logout-btn {
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  #logout-btn:hover { border-color: var(--muted); }

  main {
    flex: 1;
    overflow: hidden;
    display: flex;
    justify-content: center;
  }
  #chat-container {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    padding: 0 16px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--bubble-assistant);
    color: var(--bubble-assistant-text);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: center;
    background: transparent;
    color: var(--error);
    font-size: 13px;
  }
  .msg.pending {
    align-self: flex-start;
    background: var(--bubble-assistant);
    color: var(--muted);
    font-style: italic;
  }

  form#composer {
    display: flex;
    gap: 10px;
    padding: 14px 0 20px;
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1;
    resize: none;
    font-size: 15px;
    font-family: inherit;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel-bg);
    color: var(--text);
    outline: none;
    max-height: 140px;
  }
  #input:focus { border-color: var(--accent); }
  #send-btn {
    font-size: 15px;
    font-weight: 600;
    padding: 0 20px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  #send-btn:hover:not(:disabled) { background: var(--accent-hover); }
  #send-btn:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <header>
    <h1>Chat</h1>
    <button id="logout-btn">Log Out</button>
  </header>

  <main>
    <div id="chat-container">
      <div id="messages"></div>
      <form id="composer">
        <textarea id="input" rows="1" placeholder="Type a message..." required></textarea>
        <button type="submit" id="send-btn">Send</button>
      </form>
    </div>
  </main>

  <script>
    const messagesEl = document.getElementById('messages');
    const composer = document.getElementById('composer');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const logoutBtn = document.getElementById('logout-btn');

    const history = [];
    const TYPE_DELAY_MS = 15; // ms between revealed characters; raise to type out slower

    function addBubble(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        composer.requestSubmit();
      }
    });

    composer.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addBubble('user', text);
      history.push({ role: 'user', content: text });
      input.value = '';
      input.style.height = 'auto';

      sendBtn.disabled = true;
      input.disabled = true;
      const bubble = addBubble('pending', 'Thinking...');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history }),
        });

        if (res.status === 401) {
          window.location.href = '/';
          return;
        }

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          bubble.remove();
          addBubble('error', data.error || 'Something went wrong.');
          return;
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let assistantText = '';
        let streamError = '';

        let shownLength = 0;
        let typing = false;
        function typeOut() {
          if (typing) return;
          typing = true;
          const step = () => {
            if (shownLength < assistantText.length) {
              shownLength++;
              bubble.textContent = assistantText.slice(0, shownLength);
              messagesEl.scrollTop = messagesEl.scrollHeight;
              setTimeout(step, TYPE_DELAY_MS);
            } else {
              typing = false;
            }
          };
          step();
        }

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith('data:')) continue;
            const payload = trimmed.slice(5).trim();
            if (payload === '[DONE]') continue;

            let json;
            try {
              json = JSON.parse(payload);
            } catch {
              continue;
            }

            if (json.error) {
              streamError = json.error.message || 'OpenRouter request failed';
              continue;
            }

            const delta = json.choices?.[0]?.delta?.content;
            if (delta) {
              if (!assistantText) {
                bubble.classList.remove('pending');
                bubble.classList.add('assistant');
              }
              assistantText += delta;
              typeOut();
            }
          }
        }

        while (typing) {
          await new Promise((resolve) => setTimeout(resolve, TYPE_DELAY_MS));
        }

        if (streamError && !assistantText) {
          bubble.remove();
          addBubble('error', streamError);
        } else {
          history.push({ role: 'assistant', content: assistantText });
        }
      } catch (err) {
        bubble.remove();
        addBubble('error', 'Could not reach the server.');
      } finally {
        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/';
    });
  </script>
</body>
</html>
